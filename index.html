<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF1F0">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Бюджет">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head><body>
<title>Мой бюджет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Rubik+Bubbles&family=Pixelify+Sans:wght@500;700&family=Rubik+Doodle+Shadow&family=Pacifico&display=swap">
<style>
/* Layout: a money jar. Pastel colour blobs behind frosted cards; the day's food money is liquid in a jar, categories float as bubbles, the month is a glowing calendar */
:root{
  --bg:#FBF1F0; --paper:#FFFFFF; --paper-2:#F8ECEB; --ink:#4A3640; --muted:#9C8790; --line:#F0E1DF;
  --accent:#E58FA6; --accent-2:#F6B88B; --accent-ink:#FFFFFF; --blob1:#FFCFDC; --blob2:#FFE3C4; --blob3:#E3D5FF;
  --glass:rgb(255 255 255 / .62); --glass-line:rgb(255 255 255 / .9);
  --bad:#D9667C; --good:#56A06F; --chip-ink:#3E3038;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-fun:"Rubik Bubbles","Rubik",system-ui,sans-serif; --fun-scale:1;
}
body[data-skin="sage"]{--bg:#EEF3EC; --paper-2:#EAF1E7; --ink:#36443A; --muted:#7E8C80; --line:#DDE7D9; --accent:#86B596; --accent-2:#E9C98A; --blob1:#CDEBD8; --blob2:#F4EBC8; --blob3:#CFE4F4}
body[data-skin="lavender"]{--bg:#F2EFFA; --paper-2:#EEEAF8; --ink:#3F3952; --muted:#8B85A2; --line:#E4DFF1; --accent:#A592DA; --accent-2:#F2A9C8; --blob1:#DCD2FF; --blob2:#FFD8EC; --blob3:#CDEBFF}
body[data-font="pixel"]{--f-fun:"Pixelify Sans","Rubik",monospace; --fun-scale:1.02}
body[data-font="doodle"]{--f-fun:"Rubik Doodle Shadow","Rubik",sans-serif; --fun-scale:1}
body[data-font="retro"]{--f-fun:"Pacifico","Rubik",cursive; --fun-scale:.9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body:not([data-mode="light"]){
  --bg:#1C1820; --paper:#2A2430; --paper-2:#332C3A; --ink:#F6ECF1; --muted:#B6A6B0; --line:#3C3443;
  --blob1:#4B2D47; --blob2:#4A3A2C; --blob3:#33295A; --glass:rgb(255 255 255 / .07); --glass-line:rgb(255 255 255 / .12); --bad:#F28A9D; --good:#8DD3A2}
  :root:not([data-theme="light"]):not(.force-light){color-scheme:dark;background:#1C1820}}
:root.force-dark{color-scheme:dark;background:#1C1820}
:root.force-light{color-scheme:light;background:#FBF1F0}
:root[data-theme="dark"] body:not([data-mode="light"]),body[data-mode="dark"]{
  --bg:#1C1820; --paper:#2A2430; --paper-2:#332C3A; --ink:#F6ECF1; --muted:#B6A6B0; --line:#3C3443;
  --blob1:#4B2D47; --blob2:#4A3A2C; --blob3:#33295A; --glass:rgb(255 255 255 / .07); --glass-line:rgb(255 255 255 / .12); --bad:#F28A9D; --good:#8DD3A2}
:root[data-theme="dark"]{color-scheme:dark;background:#1C1820}
:root{background:#FBF1F0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:radial-gradient(60% 40% at 6% 2%,var(--blob1),transparent 70%),radial-gradient(55% 35% at 100% 18%,var(--blob2),transparent 70%),radial-gradient(70% 45% at 25% 100%,var(--blob3),transparent 70%),var(--bg);background-attachment:fixed;
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fun{font-family:var(--f-fun);font-weight:400}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
#view{display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-fun);font-weight:400;margin:0;line-height:1.15}
h2{font-size:calc(1.25rem*var(--fun-scale))}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:calc(2rem*var(--fun-scale));color:var(--ink)}
.top .yr{font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:600;margin-left:6px}
.ctrls{display:flex;gap:6px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);display:grid;place-items:center;font-size:19px;line-height:1;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.swatch{background:conic-gradient(#F6B88B 0 25%,#E58FA6 0 50%,#86B596 0 75%,#A3B1E6 0)!important}
.today-btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.8rem;padding:8px 12px;border-radius:99px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5}
.tabs button{border:0;background:none;color:var(--muted);padding:9px 6px;border-radius:99px;font-weight:600;font-size:.9rem}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px -2px rgb(120 60 90 / .25)}

.card{background:var(--glass);border:1px solid var(--glass-line);border-radius:28px;padding:20px 18px;-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 16px 36px -26px rgb(120 60 90 / .5)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
.hint{white-space:nowrap;font-size:.8rem;color:var(--muted);font-weight:500}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:.85rem;padding:0}
.note{font-size:.82rem;color:var(--muted);margin:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* jar */
.jar svg{display:block;overflow:visible}
.jar .glass{fill:rgb(255 255 255 / .35);stroke:var(--ink);stroke-opacity:.18;stroke-width:2}
.jar .shine{fill:none;stroke:#fff;stroke-opacity:.8;stroke-width:4;stroke-linecap:round}
.jar .lid{fill:var(--accent)}
.jar .wave{animation:wave 3.2s linear infinite}
.jar .wave.b{animation-duration:5s;opacity:.55}
@keyframes wave{to{transform:translateX(60px)}}
.jar .bub{fill:#fff;opacity:.7;animation:rise 4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){.jar .wave,.jar .bub,.pop i{animation:none!important}}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:20px}
.hero .lbl{font-size:.88rem;color:var(--muted);font-weight:600}
.big{font-family:var(--f-fun);font-weight:400;font-size:calc(clamp(2.3rem,11vw,3.1rem)*var(--fun-scale));line-height:1.05;margin:4px 0;white-space:nowrap}
.big .cur{font-size:.5em;margin-left:.1em;color:var(--muted)}
.big.neg{color:var(--bad)}
.hero .meta{font-size:.84rem;font-weight:500;display:flex;flex-direction:column;gap:2px}
.hero .meta span{color:var(--muted)}
.why{grid-column:1/-1;font-size:.82rem;color:var(--muted);margin:0;line-height:1.5;padding-top:12px;border-top:1px dashed var(--line)}
.why b{color:var(--ink);font-weight:600;white-space:nowrap}
.ahead{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.ahead span{font-size:.78rem;background:var(--paper);border-radius:99px;padding:4px 10px;font-weight:500}
.ahead span i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.badge{display:inline-block;font-size:.76rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--bad);color:#fff}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--chip-ink);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-18px;top:-18px;background:rgb(255 255 255 / .35)}
.kpi .k{font-weight:600;font-size:.84rem}
.kpi .v{font-family:var(--f-fun);font-size:calc(1.4rem*var(--fun-scale));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.76rem;font-weight:500;opacity:.75}
.kpi .mb{height:6px;border-radius:99px;background:rgb(255 255 255 / .6);margin-top:8px;overflow:hidden}
.kpi .mb i{display:block;height:100%;border-radius:inherit;background:var(--chip-ink);opacity:.5}
.kpi .mb i.over{background:#B0303F;opacity:.9}

/* bubbles */
.bubbles{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0;padding:6px 0}
.bubble{border:0;border-radius:50%;display:grid;place-content:center;text-align:center;color:var(--chip-ink);margin:-5px;padding:6px;position:relative;box-shadow:inset -6px -8px 14px rgb(0 0 0 / .06),inset 6px 8px 14px rgb(255 255 255 / .55);transition:transform .2s}
.bubble:hover{transform:scale(1.04)}
.bubble b{font-family:var(--f-fun);font-weight:400;line-height:1}
.bubble span{font-size:.7rem;font-weight:600;line-height:1.15;max-width:9ch;overflow:hidden;text-overflow:ellipsis}
.bubble::after{content:"";position:absolute;width:22%;height:14%;border-radius:50%;left:22%;top:16%;background:rgb(255 255 255 / .7);transform:rotate(-30deg)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:.7rem;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal button{aspect-ratio:1;border:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;color:var(--ink);background:var(--paper-2);padding:0;min-width:0}
.cal button.has{color:var(--chip-ink)}
.cal button small{font-size:.58rem;font-weight:500;opacity:.8}
.cal button.today{outline:2px solid var(--ink);outline-offset:1px}
.cal button.sel{transform:scale(1.08);box-shadow:0 4px 10px -4px rgb(0 0 0 / .3)}
.cal button.future{opacity:.45}
.cal .pad{background:none}
.day-detail{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--paper);font-size:.86rem}
.day-detail b{font-family:var(--f-fun);font-weight:400;font-size:1.05rem}
.day-detail ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.day-detail li{display:flex;justify-content:space-between;gap:8px}
.day-detail li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.jars2{display:grid;grid-template-columns:1fr 1fr;gap:10px;justify-items:center;text-align:center}
.jars2 .cap{font-size:.8rem;color:var(--muted);font-weight:600}
.jars2 .amt{font-family:var(--f-fun);font-size:calc(1.15rem*var(--fun-scale))}
.verdict{display:flex;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.verdict div{display:flex;flex-direction:column}
.verdict b{font-family:var(--f-fun);font-weight:400;font-size:calc(1.35rem*var(--fun-scale))}
.verdict span{font-size:.76rem;color:var(--muted);font-weight:500}

.pf{display:flex;flex-direction:column;gap:14px}
.pf-row .t{display:flex;justify-content:space-between;font-weight:600;font-size:.92rem;margin-bottom:6px}
.pf-row .t span{color:var(--muted);font-size:.8rem;font-weight:500}
.pf-bar{display:grid;grid-template-columns:3.5em 1fr auto;gap:8px;align-items:center;font-size:.8rem;font-weight:500;margin-top:4px}
.pf-bar .tr{height:14px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.pf-bar .tr i{display:block;height:100%;border-radius:inherit}
.pf-bar .n{font-weight:600;white-space:nowrap}
.stack{display:flex;height:18px;border-radius:99px;overflow:hidden;gap:3px;background:var(--paper-2)}
.stack i{display:block;height:100%;border-radius:99px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.leg span{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:500}
.leg em{font-style:normal;color:var(--muted)}

.place{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
.place:first-of-type{border-top:0;padding-top:0}
.place .rank{font-family:var(--f-fun);font-size:calc(1.6rem*var(--fun-scale));width:1.4em;text-align:center;line-height:1}
.place .n{font-weight:600;font-size:.92rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place .s{font-size:.76rem;color:var(--muted);font-weight:500}
.place .a{font-weight:700;font-size:.92rem;text-align:right;white-space:nowrap}

.line{display:flex;align-items:baseline;gap:8px;font-size:.92rem;padding:5px 0}
.line .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;align-items:center;gap:8px;font-weight:500}
.line .lead{flex:1;min-width:12px;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.line .v{white-space:nowrap;font-weight:600}
.line .v small{color:var(--muted);font-weight:400}
.line.total{font-size:1.05rem;padding-top:10px;margin-top:6px;border-top:1px dashed var(--line)}
.line.total .k,.line.total .v{font-weight:700}
.bar{height:8px;background:var(--paper-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit}

/* limits */
.seg-switch{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--glass);border:1px solid var(--glass-line);border-radius:99px;padding:3px;gap:3px}
.seg-switch button{border:0;background:none;border-radius:99px;padding:6px 14px;font-weight:600;font-size:.82rem;color:var(--muted)}
.seg-switch button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.grp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 0 2px;margin-top:4px;border-top:1px dashed var(--line)}
.grp:first-of-type{border-top:0;padding-top:0;margin-top:0}
.grp b{font-family:var(--f-fun);font-weight:400;font-size:calc(1.08rem*var(--fun-scale));display:flex;align-items:center;gap:8px}
.grp span{font-size:.82rem;color:var(--muted);font-weight:600}
.grp-note{font-size:.78rem;color:var(--muted);margin:0 0 2px}
.crow{padding:10px 0;display:flex;flex-direction:column;gap:6px}
.crow+.crow{border-top:1px solid var(--line)}
.crow .line{padding:0}
.sub{font-size:.78rem;color:var(--muted);font-weight:500}
.plan-in{width:6.6em;text-align:right;border:1.5px dashed var(--line);background:var(--paper);border-radius:12px;padding:3px 8px;font-weight:600;font-size:.88rem}
.plan-in:focus{border-style:solid;border-color:var(--accent);outline:none}
.edit-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.edit-row input[type=text]{flex:1 1 150px;min-width:0;padding:8px 11px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper)}
.mini{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 10px;font-size:.76rem;font-weight:600}
.mini[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mini.danger{color:var(--bad);border-color:var(--bad)}
.xl-wrap{overflow-x:auto}
table.xl{width:100%;border-collapse:collapse;font-size:.8rem}
.xl th{font-weight:600;color:var(--muted);text-align:right;padding:8px 4px;border-bottom:1.5px solid var(--line);font-size:.74rem}
.xl th:first-child,.xl td:first-child{text-align:left}
.xl td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-weight:500}
.xl td:first-child{white-space:normal}
.xl tr.sub td{background:var(--paper-2);font-weight:700}
.xl tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}

/* records */
.search{width:100%;padding:12px 16px;border-radius:99px;border:1px solid var(--glass-line);background:var(--glass)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);padding:6px 13px;border-radius:99px;font-size:.84rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 2px}
.day-h:first-child{padding-top:0}
.day-h b{font-family:var(--f-fun);font-weight:400;font-size:calc(1.05rem*var(--fun-scale))}
.day-h span{font-size:.82rem;color:var(--muted);font-weight:600}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 0}
.tx .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-fun);font-size:1.05rem;color:var(--chip-ink);box-shadow:inset -4px -5px 8px rgb(0 0 0 / .06),inset 4px 5px 8px rgb(255 255 255 / .6)}
.tx .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t2{font-size:.78rem;color:var(--muted)}
.tx>div{min-width:0}
.tx .v{font-weight:700;white-space:nowrap}

/* look picker */
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.looks.f4{grid-template-columns:repeat(2,1fr)}
.look{border:2px solid var(--line);border-radius:18px;padding:10px 8px;background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:.8rem}
.look[aria-pressed="true"]{border-color:var(--ink)}
.look .sw{width:100%;height:30px;border-radius:12px}
.look .fs{font-size:1.5rem;line-height:1.1}

.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form-row input,.form-row select{padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);min-width:0}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:11px 18px;border-radius:99px}
.btn.ghost{background:var(--paper);color:var(--ink)}
.empty{text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-fun);font-weight:400;font-size:calc(1.3rem*var(--fun-scale));margin-bottom:6px}

.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;border:0;background:radial-gradient(circle at 30% 28%,#fff8 0 12%,transparent 13%),linear-gradient(140deg,var(--accent),var(--accent-2));color:#fff;font-family:var(--f-fun);font-size:36px;line-height:1;box-shadow:0 12px 26px -8px rgb(150 60 100 / .55);z-index:10;display:grid;place-items:center}
.fab:active{transform:scale(.94)}
.pop{position:fixed;pointer-events:none;z-index:40}
.pop i{position:absolute;border-radius:50%;animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}
.sheet-wrap{position:fixed;inset:0;background:rgb(50 25 40 / .4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:94%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h2{font-size:calc(1.35rem*var(--fun-scale))}
.sheet-h .icon-btn{background:var(--paper-2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--paper-2);padding:4px;border-radius:99px}
.seg button{border:0;background:none;padding:9px;border-radius:99px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgb(120 60 90 / .18)}

<script>
const MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTHS_G=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WD=["вс","пн","вт","ср","чт","пт","сб"];
// daily = goes into the daily limit; flex = monthly budget spent any time; fixed = obligatory monthly payments; save = savings
const TYPES=["daily","flex","fixed","save"];
const TYPE_LABEL={daily:"Каждый день",flex:"Гибкие",fixed:"Обязательные",save:"Копилка",inc:"Доходы"};
const TYPE_NOTE={daily:"Входит в дневной лимит",flex:"Бюджет на месяц, тратите когда удобно",fixed:"Платежи раз в месяц",save:"Откладываете на депозиты"};
// One colour family per type; categories inside a type get neighbouring shades
const FAM={daily:["#F6B88B","#F9CBA6","#F0A672","#FBDCC2"],flex:["#EE9DB1","#F3B5C4","#E4889F","#F7C9D4","#D97C93","#F0AABB","#F5BFCC"],
  fixed:["#94C7A6","#ADD5BB","#7DB993","#C4E2CE","#68A781","#A2CEB2"],save:["#A3B1E6","#BAC5EE","#8C9BDB","#CDD5F3"],inc:["#B9D99A","#CCE4B3","#A4CB82","#DBEBC9","#92BE72","#C3DEA6"]};
const DEFAULT_TYPE={food:"daily",home:"fixed",utilities:"fixed",subs:"fixed",hobby:"fixed",family:"fixed",debts:"fixed",kaspi:"save",halyk:"save",otbasy:"save"};
const DEFAULT_SETTINGS={cats:[
 {id:"food",name:"Питание",kind:"exp",plan:0},{id:"transport",name:"Транспорт",kind:"exp",plan:0},{id:"personal",name:"Личные расходы",kind:"exp",plan:0},
 {id:"friends",name:"Собирашки с друзьями",kind:"exp",plan:0},{id:"desserts",name:"Десерты",kind:"exp",plan:0},{id:"gifts",name:"Подарки",kind:"exp",plan:0},
 {id:"health",name:"Здоровье/медицина",kind:"exp",plan:0},{id:"home",name:"Дом",kind:"exp",plan:0},{id:"utilities",name:"Коммунальные услуги",kind:"exp",plan:0},
 {id:"subs",name:"Подписки",kind:"exp",plan:0},{id:"hobby",name:"Хобби",kind:"exp",plan:0},{id:"family",name:"Семье",kind:"exp",plan:0},{id:"debts",name:"Задолженности",kind:"exp",plan:0},
 {id:"kaspi",name:"Депозит Каспи",kind:"exp",plan:0},{id:"halyk",name:"Депозит Халык",kind:"exp",plan:0},{id:"otbasy",name:"Отбасы банк",kind:"exp",plan:0},
 {id:"salary",name:"Зарплата",kind:"inc",plan:0},{id:"mom",name:"Анашым",kind:"inc",plan:0},{id:"interest",name:"Процентный доход",kind:"inc",plan:0},
 {id:"savings",name:"Сбережения",kind:"inc",plan:0},{id:"moldir",name:"Мөлдір апше",kind:"inc",plan:0}
]};
const SKINS=[["powder","Пудра","linear-gradient(120deg,#FFCFDC,#FFE3C4,#E3D5FF)"],["sage","Шалфей","linear-gradient(120deg,#CDEBD8,#F4EBC8,#CFE4F4)"],["lavender","Лаванда","linear-gradient(120deg,#DCD2FF,#FFD8EC,#CDEBFF)"]];
const MODES=[["auto","Как в телефоне"],["light","Светлая"],["dark","Тёмная"]];
const FONTS=[["bubbles","Пузыри","Rubik Bubbles"],["pixel","Пиксели","Pixelify Sans"],["doodle","Каракули","Rubik Doodle Shadow"],["retro","Ретро","Pacifico"]];

const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const todayStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const curMonth=todayStr.slice(0,7);
const S={month:curMonth,tab:"overview",settings:null,monthDoc:null,tx:[],txReady:false,q:"",kindFilter:"all",catFilter:null,editCats:false,armed:null,limView:"list",selDay:null};
let ALL=[],db=null,downloads=null,P=null,LOCAL=null,unsubM=null,unsubT=null,pendingRender=false;
const LS_KEY="budget.local.v1";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
{const t=lsGet("budget.tab");if(t)S.tab=t;
 const sk=lsGet("budget.skin");document.body.dataset.skin=SKINS.some(x=>x[0]===sk)?sk:"powder";
 const fo=lsGet("budget.font2");document.body.dataset.font=FONTS.some(x=>x[0]===fo)?fo:"bubbles";applyMode(lsGet("budget.mode")||"auto")}
function applyMode(m){document.body.dataset.mode=m;const r=document.documentElement;r.classList.toggle("force-dark",m==="dark");r.classList.toggle("force-light",m==="light")}

const $=id=>document.getElementById(id);
const view=$("view");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grp=n=>Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
const fmt=n=>(n<0?"−":"")+grp(n)+" ₸";
const sgn=n=>(n>0?"+":n<0?"−":"")+grp(n)+" ₸";
const short=v=>v>=1000?(Math.round(v/100)/10).toString().replace(".",",")+"к":String(Math.round(v));
const monthName=m=>MONTHS[+m.slice(5)-1];
const shiftMonth=(m,d)=>{let [y,mm]=m.split("-").map(Number);mm+=d;while(mm<1){mm+=12;y--}while(mm>12){mm-=12;y++}return `${y}-${pad(mm)}`};
const daysIn=m=>{const [y,mm]=m.split("-").map(Number);return new Date(y,mm,0).getDate()};
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const d=n%10;if(n>10&&n<20)return c;if(d>1&&d<5)return b;if(d===1)return a;return c};
const days=n=>n+" "+plural(n,"день","дня","дней");
const pct=(a,b)=>b>0?Math.min(100,a/b*100):(a>0?100:0);

const settings=()=>S.settings||DEFAULT_SETTINGS;
const cats=k=>settings().cats.filter(c=>!k||c.kind===k);
const catById=id=>settings().cats.find(c=>c.id===id);
const typeOf=c=>!c?"flex":c.kind==="inc"?"inc":(c.type||(c.save?"save":DEFAULT_TYPE[c.id]||"flex"));
const catColor=id=>{const c=catById(id);if(!c)return "#D9CDD2";const t=typeOf(c);const list=settings().cats.filter(x=>typeOf(x)===t);return FAM[t][list.indexOf(c)%FAM[t].length]};
const typeColor=t=>FAM[t][0];
const planOf=c=>{const p=S.monthDoc&&S.monthDoc.plans;return p&&p[c.id]!=null?p[c.id]:(c.plan||0)};
const defaultPlans=()=>Object.fromEntries(cats().map(c=>[c.id,planOf(c)]));
const sumPlan=t=>cats("exp").filter(c=>typeOf(c)===t).reduce((s,c)=>s+planOf(c),0);
const ACC_COLORS=["#F29191","#9AD3C2","#B9D99A","#F6D58B","#A3B1E6","#E3A6D8","#F6B88B","#9CCFE8"];
const DEFAULT_ACCOUNTS=[{id:"a-kaspi",name:"Kaspi"},{id:"a-freedom",name:"Freedom"},{id:"a-halyk",name:"Halyk"},{id:"a-cash",name:"Наличные"}];
const NOACC="none";
const accounts=()=>settings().accounts||DEFAULT_ACCOUNTS;
const accById=id=>accounts().find(a=>a.id===id);
const accName=id=>accById(id)?.name||"без счёта";
const accColor=id=>{const i=accounts().findIndex(a=>a.id===id);return i<0?"#D9CDD2":ACC_COLORS[i%ACC_COLORS.length]};
// How a record moves money between accounts: spending takes from one, income adds, a transfer moves, a reconciliation corrects
function effects(t){const a=t.account||NOACC;
  if(t.writeoff)return [];
  if(t.kind==="debt")return [[a,t.dir==="in"?t.amount:-t.amount]];
  if(t.kind==="debtback")return [[a,t.dir==="in"?-t.amount:t.amount]];
  if(t.kind==="exp")return [[a,-t.amount]];if(t.kind==="inc"||t.kind==="adj")return [[a,t.amount]];
  if(t.kind==="transfer")return [[a,-t.amount],[t.to||NOACC,t.amount]];return []}
const net1=t=>t.kind==="transfer"?0:t.writeoff?-t.amount:effects(t).reduce((x,[,d])=>x+d,0);
// Who owes whom, across all months: lent minus returned minus written off
function debtState(){const m={};
  for(const t of ALL){if(!t.person)continue;const dir=t.dir==="in"?"in":"out";const key=dir+"|"+t.person.trim().toLowerCase();
    const e=m[key]=m[key]||{key,dir,name:t.person.trim(),v:0};
    if(t.kind==="debt")e.v+=t.amount;else if(t.kind==="debtback"||t.writeoff)e.v-=t.amount}
  return Object.values(m).filter(e=>e.v>=1).sort((a,b)=>b.v-a.v)}
const accStartOf=md=>md&&md.accStart&&Object.keys(md.accStart).length?md.accStart:null;
function balances(txs=S.tx,md=S.monthDoc){const b={};const st=accStartOf(md);
  if(st){for(const k in st)b[k]=(b[k]||0)+(+st[k]||0)}else if(md&&md.start)b[NOACC]=md.start;
  for(const t of txs)for(const [a,d] of effects(t))b[a]=(b[a]||0)+d;return b}
const goals=()=>settings().goals||[];
const recurring=()=>(settings().recurring||[]).filter(r=>catById(r.cat));
const goalSaved=id=>ALL.filter(t=>t.goal===id).reduce((s,t)=>s+(t.kind==="exp"?t.amount:-t.amount),0);
const sumPlanInc=()=>cats("inc").reduce((s,c)=>s+planOf(c),0);

function totals(txs=S.tx,monthDoc=S.monthDoc){
  const st=accStartOf(monthDoc);
  const r={start:st?Object.values(st).reduce((a,v)=>a+(+v||0),0):(monthDoc&&monthDoc.start)||0,inc:0,daily:0,flex:0,fixed:0,save:0,adj:0,debt:0,byCat:{}};
  for(const t of txs){
    if(t.kind==="adj"){r.adj+=t.amount;continue}
    if(t.kind==="debt"){r.debt+=t.dir==="in"?t.amount:-t.amount;continue}
    if(t.kind==="debtback"){r.debt+=t.dir==="in"?-t.amount:t.amount;continue}
    if(t.writeoff)r.debt+=t.amount;
    if(t.kind!=="exp"&&t.kind!=="inc")continue;
    r.byCat[t.cat]=(r.byCat[t.cat]||0)+t.amount;
    if(t.kind==="inc")r.inc+=t.amount;else{const ty=typeOf(catById(t.cat));r[ty==="inc"?"flex":ty]+=t.amount}}
  r.spent=r.daily+r.flex+r.fixed;r.out=r.spent+r.save;r.end=r.start+r.inc-r.out+r.adj+r.debt;return r;
}
/* Daily limit for the current month. Only "Каждый день" categories count against it.
   By plan: what is left of the daily-categories plan, over the remaining days (today included).
   By money: cash on hand minus what is still budgeted for flexible, obligatory and savings categories, over the same days.
   The limit is the smaller of the two. Today's daily spending is added back so the limit holds steady through the day. */
function dailyLimit(){
  const T=totals();const daysLeft=daysIn(S.month)-now.getDate()+1;
  let before=0,today=0;
  for(const t of S.tx)if(t.kind==="exp"&&typeOf(catById(t.cat))==="daily"){if(t.date===todayStr)today+=t.amount;else if(t.date<todayStr)before+=t.amount}
  const planDaily=sumPlan("daily");
  const recLeft={};for(const r of recurring())if(!S.tx.some(t=>t.rec===r.id))recLeft[r.cat]=(recLeft[r.cat]||0)+r.amount;
  const pending=cats("exp").filter(c=>typeOf(c)!=="daily").map(c=>({c,left:Math.max(0,planOf(c)-(T.byCat[c.id]||0),recLeft[c.id]||0)})).filter(x=>x.left>0).sort((a,b)=>b.left-a.left);
  const pendAll=pending.reduce((s,x)=>s+x.left,0);
  const cashNow=T.end+today;const hasCash=T.start>0||T.inc>0;
  const byPlan=planDaily>0?(planDaily-before)/daysLeft:null;
  const byCash=hasCash?(cashNow-pendAll)/daysLeft:null;
  let limit=0,basis="none";
  if(byPlan!=null&&byCash!=null){limit=Math.min(byPlan,byCash);basis=byCash<byPlan?"cash":"plan"}
  else if(byCash!=null){limit=byCash;basis="cash"}else if(byPlan!=null){limit=byPlan;basis="plan"}
  return {T,limit,today,left:limit-today,daysLeft,basis,pending,pendAll,cashNow,planDaily,before,hasCash};
}

/* Purchase memory. Anything recorded 5 or more times (a description, a place or an amount) becomes a suggestion,
   and it is always filled the same way: with the place and category used most often for it. */
const FREQ=5;
const mode=o=>{let b=null,n=0;for(const k in o)if(o[k]>n){n=o[k];b=k}return b};
const share=o=>{let t=0,m=0;for(const k in o){t+=o[k];m=Math.max(m,o[k])}return t?m/t:0};
function stats(kind){
  const notes={},places={},amounts={};
  const add=(map,key,t,label)=>{if(!key)return;const e=map[key]=map[key]||{n:0,label,cats:{},places:{},notes:{},amounts:{},accs:{}};e.n++;
    e.cats[t.cat]=(e.cats[t.cat]||0)+1;if(t.account)e.accs[t.account]=(e.accs[t.account]||0)+1;if(t.place)e.places[t.place]=(e.places[t.place]||0)+1;if(t.note)e.notes[t.note]=(e.notes[t.note]||0)+1;e.amounts[t.amount]=(e.amounts[t.amount]||0)+1};
  for(const t of ALL){if(t.kind!==kind)continue;add(notes,(t.note||"").trim().toLowerCase(),t,t.note);add(places,(t.place||"").trim().toLowerCase(),t,t.place);add(amounts,String(t.amount),t,t.amount)}
  return {notes,places,amounts};
}
function fillLists(){const st=stats("exp");

  $("personList").innerHTML=Object.entries(ppl).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([n])=>`<option value="${esc(n)}"></option>`).join("");
  $("noteList").innerHTML=Object.values(st.notes).sort((a,b)=>b.n-a.n).slice(0,40).map(e=>`<option value="${esc(e.label)}"></option>`).join("")}
function frequent(kind){
  const m={};
  for(const t of ALL){if(t.kind!==kind)continue;const key=((t.note||"")+"|"+(t.place||"")).toLowerCase().trim();if(key==="|")continue;
    const e=m[key]=m[key]||{n:0,last:null};e.n++;if(!e.last||(t.ts||0)>(e.last.ts||0))e.last=t}
  const st=stats(kind);
  return Object.values(m).filter(e=>e.n>=FREQ&&catById(e.last.cat)).sort((a,b)=>b.n-a.n).slice(0,8).map(e=>{
    const t=Object.assign({},e.last);const ne=st.notes[(t.note||"").trim().toLowerCase()];
    if(ne){const c=mode(ne.cats);if(catById(c))t.cat=c;t.place=mode(ne.places)||t.place;t.account=mode(ne.accs)||t.account;t.amount=+mode(ne.amounts)||t.amount}return t});
}

/* ---------- jar ---------- */
let jarN=0;
function jar(level,w,color1,color2,label){
  const id="j"+(++jarN);level=Math.max(0,Math.min(1,level));
  const h=w*1.25,x0=w*.12,x1=w*.88,top=h*.2,bot=h*.97,yL=bot-(bot-top-6)*level;
  const body=`M${x0+6},${top} Q${x0},${top} ${x0},${top+14} L${x0},${bot-16} Q${x0},${bot} ${x0+16},${bot} L${x1-16},${bot} Q${x1},${bot} ${x1},${bot-16} L${x1},${top+14} Q${x1},${top} ${x1-6},${top} Z`;
  const wave=y=>{let d=`M${-2*w} ${y}`;for(let i=0;i<Math.ceil(4*w/30)+2;i++)d+=` q 15 ${i%2?6:-6} 30 0`;return d+` L ${3*w} ${h} L ${-2*w} ${h} Z`};
  const bubbles=level>0.05?[0,1,2].map(i=>`<circle class="bub" cx="${x0+(x1-x0)*(.25+.25*i)}" cy="${bot-8}" r="${2+i}" style="animation-delay:${i*1.3}s"/>`).join(""):"";
  return `<div class="jar"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <defs><clipPath id="${id}"><path d="${body}"/></clipPath><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color1}"/><stop offset="1" stop-color="${color2}"/></linearGradient></defs>
    <path class="glass" d="${body}"/>
    <g clip-path="url(#${id})">${level>0?`<g class="wave b"><path d="${wave(yL-3)}" fill="${color2}"/></g><g class="wave"><path d="${wave(yL)}" fill="url(#${id}g)"/></g>${bubbles}`:""}</g>
    <rect class="lid" x="${x0-3}" y="${top-h*.1}" width="${x1-x0+6}" height="${h*.1}" rx="${h*.04}"/>
    <path class="shine" d="M${x0+10},${top+20} L${x0+10},${top+20+(bot-top)*.35}"/>
    ${label?`<text x="${w/2}" y="${top+(bot-top)*.55}" text-anchor="middle" style="font:600 ${w*.1}px var(--f-body);fill:var(--ink);opacity:.55">${label}</text>`:""}
  </svg></div>`;
}

const MONTHS_P=["январе","феврале","марте","апреле","мае","июне","июле","августе","сентябре","октябре","ноябре","декабре"];
// Days in a row when food spending stayed within the daily limit
function vStreak(){
  const dim=daysIn(S.month),td=now.getDate();const food=Array(dim+1).fill(0);
  for(const t of S.tx)if(t.kind==="exp"&&typeOf(catById(t.cat))==="daily"){const d=+t.date.slice(8,10);if(d>=1&&d<=dim)food[d]+=t.amount}
  if(!food.some(Boolean))return "";
  const pd=sumPlan("daily");const lim=pd>0?pd/dim:dailyLimit().limit;if(!(lim>0))return "";
  let n=0;for(let d=td;d>=1;d--){if(food[d]<=lim)n++;else break}
  const dots=[];for(let d=Math.max(1,td-6);d<=td;d++)dots.push(`<span style="background:${food[d]<=lim?FAM.inc[1]:FAM.flex[2]}" title="${d}: ${fmt(food[d])}">${d}</span>`);
  return `<section class="card streak"><div class="n">${n}</div><div><div class="t">${n?plural(n,"день","дня","дней")+" подряд в лимите на еду":"Сегодня лимит на еду превышен"}</div>
    <div class="note">${pd>0?"лимит по плану":"по сегодняшнему лимиту"}: ${grp(lim)} ₸ в день</div><div class="days7">${dots.join("")}</div></div></section>`;

function vCompare(){
  if(!S.prevTx||!S.prevTx.length||!S.tx.length)return "";
  const isCur=S.month===curMonth;const cut=isCur?now.getDate():99;
  const sumT=(list,t)=>list.filter(x=>x.kind==="exp"&&+x.date.slice(8,10)<=cut&&(t?typeOf(catById(x.cat))===t:typeOf(catById(x.cat))!=="save")).reduce((s,x)=>s+x.amount,0);
  const pm=shiftMonth(S.month,-1);const pIn=MONTHS_P[+pm.slice(5)-1];
  const rows=[["daily","Еда"],["flex","Гибкие"],["fixed","Обязательные"],["","Всего"]].map(([t,l])=>({t,l,c:sumT(S.tx,t),p:sumT(S.prevTx,t)})).filter(r=>r.c||r.p);

function vBubbles(){
  const T=totals();let rows=[];
  for(const t of ["daily","flex","fixed"])cats("exp").filter(c=>typeOf(c)===t).forEach(c=>{const v=T.byCat[c.id]||0;if(v>0)rows.push({id:c.id,name:c.name,v,color:catColor(c.id)})});
  const orphan=Object.keys(T.byCat).filter(id=>!catById(id)).reduce((s,id)=>s+T.byCat[id],0);
  if(orphan)rows.push({id:"",name:"Другое",v:orphan,color:"#D9CDD2"});
  const total=rows.reduce((s,r)=>s+r.v,0);if(!total)return "";
  rows.sort((a,b)=>b.v-a.v);const max=rows[0].v;

  const order=[];rows.forEach((r,i)=>i%2?order.push(r):order.unshift(r));

   ${orphan.length?`<p class="note">Записи на ${fmt(orphan.reduce((s,id)=>s+T.byCat[id],0))} из удалённых категорий тоже учтены в итогах.</p>`:""}
   ${S.editCats?`<section class="card"><div class="head"><h2>Новая категория</h2></div><div class="form-row">
      <input id="ncName" placeholder="Название" style="flex:1 1 160px"><select id="ncKind" aria-label="Тип">${TYPES.map(k=>`<option value="${k}">${TYPE_LABEL[k]}</option>`).join("")}<option value="inc">Доход</option></select>
      <button class="btn" data-act="addCat">Добавить</button></div></section>`:""}`+manage+settingsCards;
}

function txRow(t){
  if(t.kind==="debt"||t.kind==="debtback"){const out=t.dir!=="in";const lab=t.kind==="debt"?(out?"дала в долг":"взяла в долг"):(out?"вернула мне":"я вернула");const n=net1(t);
    return `<button class="tx" data-tx="${t.id}"><span class="ic" style="background:${out?FAM.inc[3]:FAM.flex[3]}">${esc((t.person||"?")[0])}</span><div><div class="t1">${esc(t.person||"")} · ${lab}</div><div class="t2">${esc([t.note,t.place,t.account?accName(t.account):""].filter(Boolean).join(" · "))}</div></div><span class="v ${n>0?"pos":""}">${sgn(n)}</span></button>`}
  if(t.kind==="transfer")return `<button class="tx" data-tx="${t.id}"><span class="ic" style="background:${accColor(t.account)}">⇄</span><div><div class="t1">${esc(t.note||"Перевод")}</div><div class="t2">${esc(accName(t.account))} → ${esc(accName(t.to))}</div></div><span class="v">${grp(t.amount)} ₸</span></button>`;
  if(t.kind==="adj")return `<button class="tx" data-tx="${t.id}"><span class="ic" style="background:var(--paper-2)">±</span><div><div class="t1">Сверка с банком</div><div class="t2">${esc(accName(t.account))}</div></div><span class="v ${t.amount>0?"pos":"neg"}">${sgn(t.amount)}</span></button>`;
  const c=catById(t.cat);const nm=c?.name||"?";
  const extra=[t.note?t.place:"",t.account?accName(t.account):""].filter(Boolean).map(esc).join(" · ");
  return `<button class="tx" data-tx="${t.id}"><span class="ic" style="background:${catColor(t.cat)}">${esc(nm[0])}</span><div><div class="t1">${esc(t.note||t.place||nm)}</div><div class="t2">${esc(nm)}${extra?" · "+extra:""}</div></div><span class="v ${t.kind==="inc"?"pos":""}">${t.kind==="inc"?"+":"−"}${grp(t.amount)} ₸</span></button>`;
}

function renderOpsList(){
  const ch=$("opsChips"),el=$("opsList");if(!el)return;
  ch.innerHTML=[["all","Все"],["exp","Расходы"],["inc","Доходы"],["transfer","Переводы"],["debt","Долги"]].map(([k,l])=>`<button class="chip" data-kf="${k}" aria-pressed="${S.kindFilter===k&&!S.catFilter}">${l}</button>`).join("")
    +(S.catFilter?`<button class="chip" data-cf="" aria-pressed="true">${D(catColor(S.catFilter))}${esc(catById(S.catFilter)?.name||"")} ×</button>`:"");
  if(!S.txReady){el.innerHTML=`<p class="note">Загружаю…</p>`;return}
  const q=S.q.trim().toLowerCase();
  const list=S.tx.filter(t=>(S.kindFilter==="all"||t.kind===S.kindFilter||(S.kindFilter==="debt"&&(t.kind==="debtback"||t.writeoff)))&&(!S.catFilter||t.cat===S.catFilter)&&(!q||(t.note||"").toLowerCase().includes(q)||(t.place||"").toLowerCase().includes(q)||accName(t.account).toLowerCase().includes(q)||(catById(t.cat)?.name||"").toLowerCase().includes(q)))
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
  if(!list.length){el.innerHTML=`<div class="empty"><b>${S.tx.length?"Ничего не нашлось":"Записей пока нет"}</b>${S.tx.length?"Попробуйте другой запрос или фильтр.":"Нажмите «+», чтобы добавить первую."}</div>`;return}
  const groups={};for(const t of list)(groups[t.date]=groups[t.date]||[]).push(t);

  el.innerHTML=Object.entries(groups).map(([d,ts])=>{const dt=new Date(d+"T12:00");const sum=ts.reduce((s,t)=>s+net1(t),0);
    return `<div class="day-h"><b>${d===todayStr?"Сегодня":dt.getDate()+" "+MONTHS_G[dt.getMonth()]+", "+WD[dt.getDay()]}</b><span>${sum<0?"−":"+"}${grp(sum)} ₸</span></div>`
     +ts.map(txRow).join("")}).join("")
   +L("Итого",fmt(net),"total");
}

function parseNum(v){let s=String(v).replace(/[^\d.,-]/g,"");if(!s)return NaN;
  const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
  if(lc>-1&&ld>-1)s=lc>ld?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
  else if(lc>-1)s=/,\d{1,2}$/.test(s)?s.replace(/,(?=.*,)/g,"").replace(",","."):s.replace(/,/g,"");
  else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,"");
  else if(/^\d{1,3}\.\d{3}$/.test(s))s=s.replace(".","");
  return parseFloat(s)}

async function carryOver(btn){
  const pm=shiftMonth(S.month,-1);btn.disabled=true;
  try{let txs,md;
    if(db){const [q,d]=await Promise.all([P.tx().where("month","==",pm).get(),P.month(pm).get()]);txs=q.docs.map(x=>x.data());md=d.exists?d.data():null}
    else{txs=LOCAL.tx.filter(t=>t.month===pm);md=LOCAL.months[pm]||null}
    const b=balances(txs,md);const acc={};for(const a of accounts())acc[a.id]=Math.round(b[a.id]||0);
    const total=Object.values(acc).reduce((x,y)=>x+y,0);const rest=Math.round(b[NOACC]||0);
    if(!total&&!rest){toast("В "+MONTHS_P[+pm.slice(5)-1]+" нет данных для переноса");btn.disabled=false;return}
    await saveMonth({accStart:acc,start:total});
    toast(rest?`Перенесено ${fmt(total)}. Ещё ${fmt(rest)} были без счёта: впишите их вручную`:"Остатки перенесены: "+fmt(total));
  }catch(e){toast("Не получилось посчитать остаток. Попробуйте ещё раз.")}
  btn.disabled=false;
}
async function backup(btn){
  btn.disabled=true;
  try{const months={};
    if(db){for(const m of [...new Set(ALL.map(t=>t.month))]){const d=await P.month(m).get();if(d.exists)months[m]=d.data()}}else Object.assign(months,LOCAL.months);
    const data=JSON.stringify({app:"moy-budzhet",v:1,saved:new Date().toISOString(),settings:settings(),months,tx:ALL});
    const name=`Бюджет копия ${todayStr}.json`;
    if(downloads)await downloads.save({filename:name,data});
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
  }catch(e){if(!e||e.code!=="declined")toast("Не получилось сохранить копию.")}
  btn.disabled=false;
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function exportXlsx(btn){
  btn.disabled=true;const old=btn.textContent;btn.textContent="Готовлю файл…";
  try{
    if(!window.XLSX)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const T=totals();const wb=XLSX.utils.book_new();
    const sum=[["Бюджет",monthName(S.month)+" "+S.month.slice(0,4)],["На начало",T.start],["Доходы",T.inc],["Каждый день",T.daily],["Гибкие",T.flex],["Обязательные",T.fixed],["Копилка",T.save],["Сверка",T.adj],["Остаток",T.end],[],["Категория","Тип","План","Факт","Разница"]];
    for(const c of cats()){const t=typeOf(c),f=T.byCat[c.id]||0,p=planOf(c);sum.push([c.name,TYPE_LABEL[t],p,f,t==="inc"?f-p:p-f])}
    const ws1=XLSX.utils.aoa_to_sheet(sum);ws1["!cols"]=[{wch:24},{wch:14},{wch:12},{wch:12},{wch:12}];XLSX.utils.book_append_sheet(wb,ws1,"Сводка");
    const KL={exp:"Расход",inc:"Доход",transfer:"Перевод",adj:"Сверка",debt:"Долг",debtback:"Возврат долга"};
    const rows=[["Дата","Тип","Сумма","Категория","На что","Где","Счёт","Куда / кто"]].concat(S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,KL[t.kind]||t.kind,t.amount,catById(t.cat)?.name||"",t.note||"",t.place||"",t.account?accName(t.account):"",t.to?accName(t.to):(t.person||"")]));
    const ws2=XLSX.utils.aoa_to_sheet(rows);ws2["!cols"]=[{wch:12},{wch:9},{wch:11},{wch:22},{wch:30},{wch:18},{wch:12},{wch:12}];XLSX.utils.book_append_sheet(wb,ws2,"Записи");
    const data=new Uint8Array(XLSX.write(wb,{type:"array",bookType:"xlsx"}));const name=`Бюджет ${S.month}.xlsx`;
    if(downloads)await downloads.save({filename:name,data});
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
  }catch(e){if(!e||e.code!=="declined")toast("Не получилось сохранить файл. Для выгрузки нужен интернет.")}
  btn.disabled=false;btn.textContent=old;
}

/* ---------- add / edit sheet ---------- */
let F={};
function catOrder(kind){
  const cnt={};for(const t of ALL.length?ALL:S.tx)cnt[t.cat]=(cnt[t.cat]||0)+1;
  return cats(kind).map((c,i)=>({c,i})).sort((a,b)=>(cnt[b.c.id]||0)-(cnt[a.c.id]||0)||a.i-b.i).map(x=>x.c);
}
function renderSheetCats(){
  const isT=F.kind==="transfer";
  $("accLbl").textContent=F.kind==="inc"?"На какой счёт":isT?"Откуда":"С какого счёта";
  $("fAcc").innerHTML=accounts().map(a=>`<button type="button" class="chip" data-fa="${a.id}" aria-pressed="${F.account===a.id}">${D(accColor(a.id))}${esc(a.name)}</button>`).join("");
  $("toWrap").hidden=!isT;
  if(isT)$("fTo").innerHTML=accounts().filter(a=>a.id!==F.account).map(a=>`<button type="button" class="chip" data-ft="${a.id}" aria-pressed="${F.to===a.id}">${D(accColor(a.id))}${esc(a.name)}</button>`).join("");
  const isD=F.kind==="debt",sp=!!F.split&&F.kind==="exp";
  ["catLbl","fCats","placeLbl","fPlace","qPlace","qAmount"].forEach(id=>$(id).hidden=isT||isD);
  if(sp){$("catLbl").hidden=true;$("fCats").hidden=true}
  $("debtWrap").hidden=!isD;$("splitBtn").hidden=F.kind!=="exp"||!!F.id;$("splitWrap").hidden=!sp;
  document.querySelectorAll("#debtDir button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.dir===F.dir)));
  if(isD)$("accLbl").textContent=F.dir==="in"?"На какой счёт получили":"С какого счёта дали";$("noteLbl").textContent=isT?"Комментарий":"На что";$("fNote").placeholder=isT?"Например, сняла наличные":"Например, хлеб и молоко";$("pasteBtn").hidden=isT||!!F.id;if(isT)$("newCat").hidden=true;
  $("fCats").innerHTML=catOrder(F.kind).map(c=>`<button type="button" class="chip" data-fc="${c.id}" aria-pressed="${F.cat===c.id}">${D(catColor(c.id))}${esc(c.name)}</button>`).join("")
    +`<button type="button" class="chip add" id="ncToggle">+ Новая категория</button>`;
  $("ncSheetType").innerHTML=F.kind==="inc"?`<option value="inc">Доход</option>`:TYPES.map(k=>`<option value="${k}"${k==="flex"?" selected":""}>${TYPE_LABEL[k]}</option>`).join("");
  const fr=F.id?[]:frequent(F.kind);$("sugWrap").hidden=!fr.length;
  $("sug").innerHTML=fr.map((t,i)=>`<button type="button" data-sug="${i}" style="background:${catColor(t.cat)}">${esc(t.note||t.place)}<small>${grp(t.amount)} ₸${t.place&&t.note?" · "+esc(t.place):""}</small></button>`).join("");
  F.sug=fr;
  const st=F.id?null:stats(F.kind);
  F.qa=st?Object.values(st.amounts).filter(e=>e.n>=FREQ).sort((a,b)=>b.n-a.n).slice(0,6):[];
  F.qp=st?Object.values(st.places).filter(e=>e.n>=FREQ).sort((a,b)=>b.n-a.n).slice(0,8):[];
  $("qAmount").innerHTML=F.qa.map((e,i)=>`<button type="button" data-qa="${i}"><b>${grp(e.label)} ₸</b>${share(e.notes)>=.8&&mode(e.notes)?" · "+esc(mode(e.notes)):""}</button>`).join("");
  $("qPlace").innerHTML=F.qp.map((e,i)=>`<button type="button" data-qp="${i}">${D(catColor(mode(e.cats)))} ${esc(e.label)}</button>`).join("");
  const showG=F.kind==="exp"&&!F.split&&typeOf(catById(F.cat))==="save"&&goals().length>0;$("goalWrap").hidden=!showG;
  if(showG)$("fGoals").innerHTML=`<button type="button" class="chip" data-fg="" aria-pressed="${!F.goal}">Без цели</button>`+goals().map(g=>`<button type="button" class="chip" data-fg="${g.id}" aria-pressed="${F.goal===g.id}">${esc(g.name)}</button>`).join("");
  document.querySelectorAll("#kindSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.kind===F.kind)));
}
function openSheet(t,prefill){
  F={id:t?t.id:null,kind:t?t.kind:"exp",cat:t?t.cat:(prefill&&prefill.cat)||null,catTouched:!!t||!!(prefill&&prefill.cat),armed:false,goal:t?t.goal||null:(prefill&&prefill.goal)||null,rec:t?t.rec||null:null,
    account:t?t.account||null:(prefill&&prefill.account)||lsGet("budget.acc")||accounts()[0]?.id,to:t?t.to||null:null,accTouched:!!t};
  if(F.account&&!accById(F.account))F.account=accounts()[0]?.id;
  F.dir=t?t.dir||"out":"out";F.split=null;$("fPerson").value=t?t.person||"":"";renderSplit();
  $("sheetTitle").textContent=t?"Изменить запись":"Новая запись";
  $("fAmount").value=t?String(t.amount):(prefill&&prefill.amount)||"";$("fNote").value=t?t.note||"":(prefill&&prefill.note)||"";
  $("fPlace").value=t?t.place||"":(prefill&&prefill.place)||"";$("newCat").hidden=true;$("ncSheetName").value="";
  $("fDate").value=t?t.date:(S.month===curMonth?todayStr:S.month+"-01");$("fErr").textContent="";
  $("fDelete").hidden=!t;$("fDelete").textContent="Удалить";$("fSave").textContent=t?"Сохранить":"Записать";
  renderSheetCats();if(!t&&($("fNote").value||$("fPlace").value))suggestCat();
  $("pasteBtn").hidden=!!t;
  $("sheetWrap").hidden=false;if(!(prefill&&prefill.amount))setTimeout(()=>{($("fAmount").value?$("fNote"):$("fAmount")).focus()},120);
}
function closeSheet(){$("sheetWrap").hidden=true}
function suggestCat(){ // a frequent description fills the usual place and category; otherwise reuse the last match
  const st=stats(F.kind);const ne=st.notes[$("fNote").value.trim().toLowerCase()];
  if(ne&&ne.n>=FREQ){const c=mode(ne.cats);if(!$("fPlace").value.trim()&&mode(ne.places))$("fPlace").value=mode(ne.places);
    if(!F.accTouched&&accById(mode(ne.accs))&&F.account!==mode(ne.accs)){F.account=mode(ne.accs);renderSheetCats()}
    if(!F.catTouched&&catById(c)&&F.cat!==c){F.cat=c;renderSheetCats()}return}
  const pe=st.places[$("fPlace").value.trim().toLowerCase()];
  if(pe&&pe.n>=FREQ&&!F.catTouched){const c=mode(pe.cats);if(catById(c)&&F.cat!==c){F.cat=c;renderSheetCats()}return}
  if(F.catTouched)return;const pool=ALL.length?ALL:S.tx;
  const p=$("fPlace").value.trim().toLowerCase();const w=$("fNote").value.trim().toLowerCase().split(/\s+/)[0];
  const hit=pool.filter(t=>t.kind===F.kind&&((p&&(t.place||"").toLowerCase()===p)||(w&&w.length>=3&&(t.note||"").toLowerCase().startsWith(w)))).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
  if(hit&&catById(hit.cat)&&F.cat!==hit.cat){F.cat=hit.cat;renderSheetCats()}
}
function pop(from){ // a few bubbles float up from the add button (or the given element)
  const r=(from&&from.getBoundingClientRect?from:$("fab")).getBoundingClientRect();const el=document.createElement("div");el.className="pop";el.style.left=(r.left+r.width/2)+"px";el.style.top=(r.top+r.height/2)+"px";
  el.innerHTML=Array.from({length:8},(_,i)=>{const s=8+Math.random()*12;return `<i style="width:${s}px;height:${s}px;left:${-s/2}px;top:${-s/2}px;background:${[FAM.daily[0],FAM.flex[0],FAM.fixed[0],FAM.save[0]][i%4]};--x:${Math.round(Math.random()*120-90)}px;--y:${Math.round(-60-Math.random()*110)}px;animation-delay:${i*40}ms"></i>`}).join("");
  document.body.appendChild(el);setTimeout(()=>el.remove(),1400);
}
$("fab").onclick=()=>openSheet(null);
$("sheetClose").onclick=closeSheet;
$("sheetWrap").addEventListener("click",e=>{if(e.target.id==="sheetWrap")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheetWrap").hidden)closeSheet()});
$("kindSeg").addEventListener("click",e=>{const b=e.target.closest("[data-kind]");if(!b)return;if(F.kind!==b.dataset.kind){F.kind=b.dataset.kind;F.cat=null;F.catTouched=false}renderSheetCats()});
$("sug").addEventListener("click",e=>{const b=e.target.closest("[data-sug]");if(!b)return;const t=F.sug[+b.dataset.sug];
  $("fNote").value=t.note||"";$("fPlace").value=t.place||"";if(!$("fAmount").value)$("fAmount").value=String(t.amount);F.cat=t.cat;F.catTouched=true;if(t.account&&accById(t.account)&&!F.accTouched)F.account=t.account;$("fErr").textContent="";renderSheetCats()});
$("qAmount").addEventListener("click",e=>{const b=e.target.closest("[data-qa]");if(!b)return;const q=F.qa[+b.dataset.qa];
  $("fAmount").value=String(q.label);
  if(share(q.notes)>=.8){const n=mode(q.notes);if(n&&!$("fNote").value)$("fNote").value=n}
  if(share(q.places)>=.8){const pl=mode(q.places);if(pl&&!$("fPlace").value)$("fPlace").value=pl}
  if(!F.accTouched&&share(q.accs)>=.8&&accById(mode(q.accs)))F.account=mode(q.accs);
  if(!F.catTouched&&share(q.cats)>=.8&&catById(mode(q.cats))){F.cat=mode(q.cats);renderSheetCats()}else suggestCat()});
$("qPlace").addEventListener("click",e=>{const b=e.target.closest("[data-qp]");if(!b)return;const q=F.qp[+b.dataset.qp];
  $("fPlace").value=q.label;if(!F.accTouched&&accById(mode(q.accs)))F.account=mode(q.accs);const c=mode(q.cats);if(!F.catTouched&&catById(c)){F.cat=c;renderSheetCats()}});
$("ncSheetAdd").addEventListener("click",async()=>{const name=$("ncSheetName").value.trim();if(!name){$("ncSheetName").focus();return}
  const c={id:"c"+Date.now().toString(36),name,kind:F.kind,plan:0};if(F.kind==="exp")c.type=$("ncSheetType").value;
  await saveSettings({...settings(),cats:settings().cats.concat([c])});F.cat=c.id;F.catTouched=true;$("newCat").hidden=true;renderSheetCats();toast("Категория «"+name+"» создана")});
$("fCats").addEventListener("click",e=>{if(e.target.closest("#ncToggle")){$("newCat").hidden=!$("newCat").hidden;if(!$("newCat").hidden)$("ncSheetName").focus();return}
  const b=e.target.closest("[data-fc]");if(!b)return;F.cat=b.dataset.fc;F.catTouched=true;$("fErr").textContent="";renderSheetCats()});
/* Split one receipt into parts: each part gets its own category, and a part paid for someone else becomes a debt */
function renderSplit(){
  $("splitBtn").textContent=F.split?"Не делить чек":"Разделить чек на части";$("splitWrap").hidden=!F.split;if(!F.split)return;
  const opts=cats("exp").map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")+`<option value="__debt">За другого, в долг</option>`;
  $("splitRows").innerHTML=F.split.map((x,i)=>`<div class="srow" data-i="${i}"><input class="s-amt" inputmode="decimal" placeholder="Сумма" value="${esc(x.amount)}" aria-label="Сумма части"><select class="s-cat" aria-label="Категория части">${opts}</select>${F.split.length>2?`<button type="button" class="s-del" aria-label="Убрать часть">×</button>`:"<span></span>"}<input class="s-person" list="personList" placeholder="За кого? Например, Айгерим" value="${esc(x.person||"")}" ${x.cat==="__debt"?"":"hidden"} aria-label="За кого"></div>`).join("");
  $("splitRows").querySelectorAll(".srow").forEach((el,i)=>el.querySelector(".s-cat").value=F.split[i].cat);
  splitLeft();
}
function splitLeft(){if(!F.split)return;const total=parseNum($("fAmount").value)||0;const sum=F.split.reduce((x,y)=>x+(parseNum(y.amount)||0),0);const d=total-sum;
  $("splitLeft").textContent=!total?"Сначала впишите общую сумму":Math.abs(d)<1?"Всё распределено":d>0?`Осталось распределить ${fmt(d)}`:`Больше суммы на ${fmt(-d)}`}
function fillFirst(){ // the first part takes whatever is left of the total
  if(!F.split)return;const total=parseNum($("fAmount").value)||0;const rest=F.split.slice(1).reduce((x,y)=>x+(parseNum(y.amount)||0),0);
  if(total>0&&total-rest>=0){F.split[0].amount=String(Math.round((total-rest)*100)/100);const el=$("splitRows").querySelector('.srow[data-i="0"] .s-amt');if(el)el.value=F.split[0].amount}splitLeft()}
$("splitBtn").addEventListener("click",()=>{
  if(F.split){F.split=null}else{const daily=cats("exp").find(c=>typeOf(c)==="daily");
    F.split=[{amount:$("fAmount").value||"",cat:F.cat||(daily&&daily.id)||cats("exp")[0].id,person:""},{amount:"",cat:"__debt",person:""}]}
  renderSplit();renderSheetCats()});
$("splitAdd").addEventListener("click",()=>{F.split.push({amount:"",cat:cats("exp")[0].id,person:""});renderSplit()});
$("splitRows").addEventListener("input",e=>{const row=e.target.closest(".srow");if(!row)return;const i=+row.dataset.i;
  if(e.target.classList.contains("s-amt")){F.split[i].amount=e.target.value;if(i>0)fillFirst();else splitLeft()}
  if(e.target.classList.contains("s-person"))F.split[i].person=e.target.value});
$("splitRows").addEventListener("change",e=>{if(!e.target.classList.contains("s-cat"))return;const i=+e.target.closest(".srow").dataset.i;F.split[i].cat=e.target.value;renderSplit()});
$("splitRows").addEventListener("click",e=>{if(!e.target.classList.contains("s-del"))return;F.split.splice(+e.target.closest(".srow").dataset.i,1);renderSplit();fillFirst()});
$("fAmount").addEventListener("input",()=>{if(F.split)fillFirst()});
$("debtDir").addEventListener("click",e=>{const b=e.target.closest("[data-dir]");if(!b)return;F.dir=b.dataset.dir;renderSheetCats()});
$("fAcc").addEventListener("click",e=>{const b=e.target.closest("[data-fa]");if(!b)return;F.account=b.dataset.fa;F.accTouched=true;if(F.to===F.account)F.to=null;renderSheetCats()});
$("fTo").addEventListener("click",e=>{const b=e.target.closest("[data-ft]");if(!b)return;F.to=b.dataset.ft;$("fErr").textContent="";renderSheetCats()});
$("fGoals").addEventListener("click",e=>{const b=e.target.closest("[data-fg]");if(!b)return;F.goal=b.dataset.fg||null;renderSheetCats()});
/* Apple Pay: an iPhone Shortcut copies "budget:2500;Magnum" after each payment. Here it is read back from the clipboard,
   or caught when pasted into the amount field. */
function applyPaid(text){const m=String(text||"").trim().replace(/^budget:/i,"");const parts=m.split(";");
  const amt=parseNum(parts[0]);if(!(amt>0))return false;$("fAmount").value=String(Math.round(amt*100)/100);
  const place=(parts.length>1?parts[1]:m.replace(/^[\s\d.,₸KZTkzt-]+/,"")).trim();if(place)$("fPlace").value=place;
  const card=(parts[2]||"").toLowerCase();
  if(card){const alias={kaspi:"kaspi",halyk:"halyk",homebank:"halyk",freedom:"freedom"};
    const hit=accounts().find(a=>card.includes(a.name.toLowerCase()))||accounts().find(a=>Object.entries(alias).some(([k,v])=>card.includes(k)&&a.name.toLowerCase().includes(v)));
    if(hit){F.account=hit.id;F.accTouched=true}}
  F.kind="exp";suggestCat();renderSheetCats();return true}
$("pasteBtn").addEventListener("click",async()=>{
  try{const t=await navigator.clipboard.readText();if(applyPaid(t)){toast("Оплата вставлена, проверьте категорию");return}}catch(e){}
  $("fAmount").focus();toast("Нажмите и удерживайте поле суммы, затем «Вставить»")});
$("fAmount").addEventListener("paste",e=>{const t=(e.clipboardData||window.clipboardData)?.getData("text");if(t&&/budget:|;|[A-Za-zА-Яа-я]/.test(t)&&applyPaid(t))e.preventDefault()});
$("fNote").addEventListener("input",suggestCat);
$("fNote").addEventListener("change",suggestCat);
$("fPlace").addEventListener("change",suggestCat);
$("sheet").addEventListener("submit",async e=>{
  e.preventDefault();
  const amount=parseNum($("fAmount").value);
  if(!(amount>0)){$("fErr").textContent="Введите сумму больше нуля.";$("fAmount").focus();return}
  const date=$("fDate").value||todayStr;let t;
  if(F.kind==="debt"){const person=$("fPerson").value.trim();if(!person){$("fErr").textContent="Напишите, кто.";$("fPerson").focus();return}
    t={date,month:date.slice(0,7),amount:Math.round(amount*100)/100,kind:"debt",dir:F.dir,person,account:F.account||"",note:$("fNote").value.trim(),ts:Date.now()};
  }else if(F.kind==="exp"&&F.split&&!F.id){
    const parts=F.split.map(x=>({a:parseNum(x.amount),cat:x.cat,person:(x.person||"").trim()})).filter(x=>x.a>0);
    const sum=parts.reduce((x,y)=>x+y.a,0);
    if(Math.abs(sum-amount)>=1){$("fErr").textContent=sum<amount?`Распределите ещё ${fmt(amount-sum)}`:`Части больше суммы на ${fmt(sum-amount)}`;return}
    if(parts.some(x=>x.cat==="__debt"&&!x.person)){$("fErr").textContent="Напишите, за кого часть в долг.";return}
    const gid="s"+Date.now().toString(36);const base={date,month:date.slice(0,7),note:$("fNote").value.trim(),place:$("fPlace").value.trim(),account:F.account||"",split:gid};
    $("fSave").disabled=true;
    try{for(const [i,x] of parts.entries()){const r=Object.assign({},base,{amount:Math.round(x.a*100)/100,ts:Date.now()+i});
        if(x.cat==="__debt")Object.assign(r,{kind:"debt",dir:"out",person:x.person});else Object.assign(r,{kind:"exp",cat:x.cat});await putTx(r)}
      if(F.account)lsSet("budget.acc",F.account);closeSheet();pop();
      const debts=parts.filter(x=>x.cat==="__debt");
      toast(`Записано: ${fmt(sum)}${debts.length?`, из них в долг ${debts.map(x=>x.person+" "+fmt(x.a)).join(", ")}`:""}`)}
    catch(err){$("fErr").textContent="Не получилось сохранить. Попробуйте ещё раз."}
    $("fSave").disabled=false;return;
  }else if(F.kind==="transfer"){
    if(!F.account||!F.to||F.account===F.to){$("fErr").textContent="Выберите, откуда и куда перевод.";return}
    t={date,month:date.slice(0,7),amount:Math.round(amount*100)/100,kind:"transfer",account:F.account,to:F.to,note:$("fNote").value.trim(),ts:Date.now()};
  }else{
  if(!F.cat){$("fErr").textContent="Выберите категорию.";return}
  t={date,month:date.slice(0,7),amount:Math.round(amount*100)/100,kind:F.kind,cat:F.cat,note:$("fNote").value.trim(),place:$("fPlace").value.trim(),account:F.account||"",ts:Date.now()};}
  if(F.account)lsSet("budget.acc",F.account);
  if(F.goal&&typeOf(catById(F.cat))==="save")t.goal=F.goal;if(F.rec)t.rec=F.rec;
  $("fSave").disabled=true;
  try{await putTx(t,F.id);closeSheet();if(!F.id)pop();toast(`${F.id?"Сохранено":"Записано"}: ${fmt(t.amount)} · ${t.kind==="transfer"?accName(t.account)+" → "+accName(t.to):t.kind==="debt"?(t.dir==="in"?"взяла в долг у ":"в долг: ")+t.person:catById(t.cat).name}${t.month!==S.month?" (в "+MONTHS_G[+t.month.slice(5)-1]+")":""}`)}
  catch(err){$("fErr").textContent=err&&err.code==="quota_exceeded"?"Хранилище заполнено. Удалите старые записи.":"Не получилось сохранить. Попробуйте ещё раз."}
  $("fSave").disabled=false;
});
$("fDelete").onclick=async()=>{
  if(!F.armed){F.armed=true;$("fDelete").textContent="Точно удалить?";return}
  const t=S.tx.find(x=>x.id===F.id);closeSheet();
  try{await delTx(F.id);const copy=Object.assign({},t);const id=copy.id;delete copy.id;toast("Запись удалена",{label:"Вернуть",fn:()=>putTx(copy,id)})}catch(e){toast("Не получилось удалить.")}
};
// Opened from an iPhone Shortcut after an Apple Pay payment: ?amount=2500&place=Magnum
function handleLaunchParams(){
  let p;try{p=new URLSearchParams(location.search)}catch(e){return}
  // ?pay=budget:2500;Magnum;Kaspi Gold arrives from the Apple Pay automation: open the form already filled in
  const pay=p.get("pay");
  if(pay){openSheet(null);if(!applyPaid(pay))toast("Не получилось прочитать оплату, впишите сумму");else toast("Оплата подставлена: допишите, на что, и нажмите «Записать»");
    try{history.replaceState(null,"",location.pathname)}catch(e){}return}
  const amount=p.get("amount");if(!amount)return;
  const v=parseNum(amount);openSheet(null,{amount:isNaN(v)?"":String(v),note:p.get("note")||"",place:p.get("place")||""});
  try{history.replaceState(null,"",location.pathname)}catch(e){}
}

let toastTimer;
function toast(msg,action){
  const el=$("toast");el.innerHTML=`<span>${esc(msg)}</span>`;
  if(action){const b=document.createElement("button");b.textContent=action.label;b.onclick=()=>{action.fn();el.hidden=true};el.appendChild(b)}
  el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,action?6000:2600);
}
boot();
